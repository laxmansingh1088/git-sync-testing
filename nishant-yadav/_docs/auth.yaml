markdown: |
    # Authentication

    The **Nishant Yadav** API requires authentication on every request. Endpoints in this collection use **inherited authentication**, so credentials are configured once at the collection level and applied to each call automatically.

    ## Sending your token

    Provide your token in the `Authorization` header using the Bearer scheme:

    ```http
    Authorization: Bearer YOUR_API_TOKEN
    ```

    A full request looks like:

    ```bash
    curl "https://api.example.com/nishh" \
      -H "Authorization: Bearer YOUR_API_TOKEN"
    ```

    ## Obtaining a token

    Issue or rotate tokens from your account dashboard. Treat tokens like passwords:

    - Never commit them to source control.
    - Never paste them into chat or shared logs.
    - Rotate a token immediately if it is exposed.

    ## Common errors

    | Status | Meaning | Fix |
    |--------|---------|-----|
    | `401 Unauthorized` | Missing or invalid token | Verify the `Authorization` header and that the token is current. |
    | `403 Forbidden` | Authenticated but lacking permission | Confirm your token has access to the requested resource. |

    > If your collection is configured with a different scheme (API key, Basic, etc.), update the header above to match.
