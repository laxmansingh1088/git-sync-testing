markdown: |
    # Quickstart

    Make your first call to the **Nishant Yadav** API in two steps.

    ## 1. Set your credentials

    Every endpoint inherits the collection's authentication. Pass your token in the `Authorization` header on each request (see **Authentication** for details).

    ## 2. Send a request

    The `nishh` endpoint (`GET`) is a good first call:

    ```bash
    curl "https://api.example.com/nishh" \
      -H "Authorization: Bearer YOUR_API_TOKEN"
    ```

    A successful response returns `200 OK`.

    ## Deleting a resource

    Use the `twooo` endpoint (`DELETE`) to remove a resource:

    ```bash
    curl -X DELETE "https://api.example.com/twooo" \
      -H "Authorization: Bearer YOUR_API_TOKEN"
    ```

    > Replace `https://api.example.com` with your real base URL and `YOUR_API_TOKEN` with the token from your dashboard.
