    # Welcome to the Nishant Yadav API

    The **Nishant Yadav** collection groups this service's HTTP endpoints into a single, documented surface. This guide takes you from your first authenticated request through every available operation.

    ## What's inside

    | Operation | Method | Purpose |
    |-----------|--------|---------|
    | `nishh`   | GET    | Retrieve a resource |
    | `twooo`   | DELETE | Remove a resource |

    Related operations are also organized under the **Nishant sub folder**.

    ## How to use these docs

    - **Quickstart** — make your first authenticated call in a couple of minutes.
    - **Authentication** — how to obtain and send your credentials.
    - **Endpoint reference** — request and response details for each operation.

    > Tip: every request inherits the collection's authentication, so once your token is set you're ready to call any endpoint.
