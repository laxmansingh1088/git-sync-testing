postscript: |-
    const data = nova.response.json();
    nova.test('Refresh successful', function() { nova.expect(nova.response.status).toBe(200); nova.expect(data.access_token).toBeDefined(); });
    if (data && data.access_token) {
        nova.variables.set('access_token', data.access_token);
        if (data.refresh_token) nova.variables.set('refresh_token', data.refresh_token);
        nova.variables.set('token_expires_at', String(nova.timestamp() + (data.expires_in || 3600)));
        nova.log('Token refreshed.');
    }
