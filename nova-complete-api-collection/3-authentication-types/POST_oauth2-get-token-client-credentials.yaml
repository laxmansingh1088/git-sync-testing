prescript: |-
    nova.request.setBasicAuth(nova.variables.get('client_id'), nova.variables.get('client_secret'));
    nova.request.setUrlEncodedBody({ grant_type: 'client_credentials', scope: 'read write' });
postscript: |-
    nova.test('Status 200', function() { nova.expect(nova.response.status).toBe(200); });
    const data = nova.response.json();
    nova.test('access_token present', function() { nova.expect(data.access_token).toBeDefined(); });
    if (data && data.access_token) {
        nova.variables.set('access_token', data.access_token);
        nova.variables.set('token_expires_at', String(nova.timestamp() + (data.expires_in || 3600)));
        if (data.refresh_token) nova.variables.set('refresh_token', data.refresh_token);
        nova.collectionAuth.setBearerToken(data.access_token);
        nova.log('Token stored. Expires:', new Date((nova.timestamp()+(data.expires_in||3600))*1000).toISOString());
    }
