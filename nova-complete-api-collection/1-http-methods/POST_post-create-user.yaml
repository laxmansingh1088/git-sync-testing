bodyData:
    rawJSON: |-
        {
          "name": "Test User",
          "email": "{{dynamic_email}}",
          "role": "member",
          "metadata": {
            "source": "nova",
            "created_via": "api"
          }
        }
authType: none
isAuthOverridden: true
authConfigData: ""
prescript: |-
    const uid = nova.randomInt(10000, 99999);
    nova.variables.set('dynamic_email', 'testuser_' + uid + '@example.com');
    nova.log('Creating user:', nova.variables.get('dynamic_email'));
postscript: |-
    nova.test('Status 201', function() { nova.expect(nova.response.status).toBe(201); });
    const data = nova.response.json();
    nova.test('Created user has ID', function() { nova.expect(data.id).toBeDefined(); nova.expect(data.id).toBeGreaterThan(0); });
    if (data && data.id) { nova.variables.set('user_id', String(data.id)); nova.log('Created user ID:', data.id); }
