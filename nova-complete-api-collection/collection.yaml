# yaml-language-server: $schema=https://restk.ai/schema/v1/collection.schema.json
# Restk Collection

id: "322065319600324611"
version: 1
name: nova-complete-api-collection
sortOrder: 1
isHidden: false
isSharedWithAI: false
authType: bearer
authConfigData: |-
    {
      "bearerToken": "{{access_token}}"
    }
prescript: |-
    // ── COLLECTION PRE-SCRIPT (runs before every request) ─────────────

    // 1. Auto-switch base_url based on ENV variable
    const envName = nova.variables.get('ENV') || 'development';
    const envUrls = {
        development: 'http://localhost:3000',
        staging:     'https://staging-api.example.com',
        production:  'https://api.example.com'
    };
    if (envUrls[envName]) {
        nova.variables.set('base_url', envUrls[envName]);
    }

    // 2. Token expiry warning
    const expiresAt = parseInt(nova.variables.get('token_expires_at') || '0');
    if (expiresAt > 0 && nova.timestamp() > expiresAt - 60) {
        nova.warn('[Collection] Token expired or expiring soon — run Auth > Get OAuth2 Token.');
    }

    // 3. Auto-inject headers on every request
    nova.request.setHeader('X-Request-ID', nova.uuid());
    nova.request.setHeader('X-Timestamp',  String(nova.timestamp()));

    nova.log('[PRE] ' + nova.request.method + ' ' + nova.request.url + ' | ENV: ' + envName);
postscript: |-
    // ── COLLECTION POST-SCRIPT (runs after every request) ─────────────

    // 1. Global assertion — no 5xx
    nova.test('[Global] No 5xx error', function() {
        nova.expect(nova.response.status).toBeLessThan(500);
    });

    // 2. Auto-capture ETag if present
    const etag = nova.response.getHeader('ETag');
    if (etag) nova.variables.set('etag', etag);

    nova.log('[POST] Status:', nova.response.status, '| Time:', nova.response.responseTime + 'ms', '| Size:', nova.response.size + 'B');
