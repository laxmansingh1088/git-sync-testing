id: "319413717521399811"
version: 1
name: GraphQL Body
method: POST
url: '{{base_url}}/graphql'
sortOrder: 5
description: ""
folderId: "319413717517205509"
parameters: []
headers:
    - id: "376B4500-344A-4A29-8CF8-3B438DE5ED85"
      key: Content-Type
      value: application/json
      isEnabled: true
      isSecret: false
      order: 0
bodyType: graphql
bodyContentType: json
bodyData:
    graphqlQuery: |-
        query GetUser($id: ID!) {
          user(id: $id) {
            id
            name
            email
            role
          }
        }
    graphqlVariables: '{}'
authType: none
isAuthOverridden: true
authConfigData: ""
prescript: |-
    const userId = nova.variables.get('user_id') || '123';
    nova.request.setGraphQLBody(
        `query GetUser($id: ID!) { user(id: $id) { id name email role } }`,
        { id: userId },
        'GetUser'
    );
    nova.log('GraphQL query built for user:', userId);
postscript: |-
    nova.test('Status 200', function() { nova.expect(nova.response.status).toBe(200); });
    const data = nova.response.json();
    nova.test('No GraphQL errors', function() { nova.expect(data.errors).toBeUndefined(); });
    nova.test('User data present', function() { nova.expect(data.data.user).toBeDefined(); });
skipParentScripts: false
