# yaml-language-server: $schema=https://restk.ai/schema/v1/request.schema.json
# Restk Request

id: "319413717521399838"
version: 1
name: Login → Store Token (Chained)
method: POST
url: '{{base_url}}/auth/login'
sortOrder: 3
description: ""
folderId: "319413717521399834"
parameters: []
headers:
    - id: "2E4D008B-FDCD-42BF-9C24-F68E70FD539C"
      key: Content-Type
      value: application/json
      isEnabled: true
      isSecret: false
      order: 0
bodyType: raw
bodyContentType: json
bodyData:
    rawJSON: |-
        {
          "email": "{{username}}",
          "password": "{{password}}"
        }
authType: none
isAuthOverridden: true
authConfigData: ""
prescript: |-
    nova.request.setJsonBody({
        email:    nova.variables.get('username') || 'user@example.com',
        password: nova.variables.get('password') || 'password'
    });
postscript: |-
    nova.test('Login 200', function() { nova.expect(nova.response.status).toBe(200); });
    const data = nova.response.json();
    nova.test('Token returned', function() { nova.expect(data.token || data.access_token).toBeDefined(); });
    const token = data.token || data.access_token;
    if (token) {
        nova.variables.set('access_token', token);
        nova.collectionAuth.setBearerToken(token);
        if (data.user && data.user.id) nova.variables.set('user_id', String(data.user.id));
        nova.log('Token stored and collection auth updated.');
    }
skipParentScripts: false
variables: []
