    nova.test('.toBeTruthy()',      function() { nova.expect(nova.response.status).toBeTruthy(); });
    nova.test('.toBeFalsy()',       function() { nova.expect(0).toBeFalsy(); nova.expect('').toBeFalsy(); });
    nova.test('.toBeGreaterThan()', function() { nova.expect(nova.response.responseTime).toBeGreaterThan(0); });
    nova.test('.toBeLessThan()',    function() { nova.expect(nova.response.responseTime).toBeLessThan(10000); });
    nova.test('.toContain()',       function() { nova.expect(nova.response.getHeader('Content-Type')).toContain('json'); });
    nova.test('.toHaveLength()',    function() { nova.expect('hello').toHaveLength(5); });
    nova.test('.toMatch(regex)',    function() { nova.expect(nova.response.getHeader('Content-Type')||'').toMatch(/application\/json/); });
