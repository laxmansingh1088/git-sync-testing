    const data = nova.response.json() || {};
    nova.test('.toBe()',            function() { nova.expect(nova.response.status).toBe(200); });
    nova.test('.toEqual()',         function() { nova.expect(nova.response.status).toEqual(200); });
    nova.test('.toBeDefined()',     function() { nova.expect(nova.response.body).toBeDefined(); });
    nova.test('.toBeUndefined()',   function() { nova.expect(data.noSuchField).toBeUndefined(); });
