    # Welcome to the Nishant collection

    The **Nishant collection** groups this service's HTTP endpoints into a single, documented surface. This guide takes you from your first request through each available operation.

    ## Endpoints

    | Operation | Method | Purpose |
    |-----------|--------|---------|
    | `test 1`  | DELETE | Remove a resource (Bearer auth) |
    | `test 2`  | GET    | Retrieve a resource |

    ## How to use these docs

    - **Quickstart** — make your first call in a minute.
    - **Endpoint reference** — request and response details for each operation.

    > Authentication varies by endpoint: `test 1` sends a Bearer token; `test 2` inherits the collection's auth, which is currently unauthenticated.
