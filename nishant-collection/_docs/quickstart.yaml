    # Quickstart

    There are two ways to call the **Nishant collection**, depending on the endpoint's authentication.

    ## Unauthenticated read

    `test 2` (`GET`) inherits the collection's authentication, which is currently none — so it runs unauthenticated. Set its URL, then call it:

    ```bash
    curl "https://api.example.com/your-endpoint"
    ```

    ## Authenticated delete

    `test 1` (`DELETE`) requires a Bearer token in the `Authorization` header:

    ```bash
    curl -X DELETE "https://www.google.com" \
      -H "Authorization: Bearer YOUR_API_TOKEN"
    ```

    > Replace the placeholder URL and token with your real values. DELETE is destructive — confirm the target before sending.
