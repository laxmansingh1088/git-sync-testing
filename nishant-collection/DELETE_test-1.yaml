    **When to use:** when you need to remove the target resource and hold a valid Bearer token.

    **Preconditions:** a valid Bearer token in the `Authorization` header; the target resource exists.

    **Common next steps:** confirm removal with a follow-up GET; expect a 404 on subsequent reads.

    **Don't use for:** read-only checks or partial edits — use GET or PATCH instead. DELETE is destructive and typically not reversible, so confirm the target before sending.
